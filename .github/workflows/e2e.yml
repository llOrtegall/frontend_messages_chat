name: E2E

on:
  push:
    branches: [master]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: llOrtegall/backend_messages_chat
          path: .backend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # The backend's own dev stack: Postgres 17, Redis, RustFS, the bucket (public read + CORS for :3001)
      # and Mailpit for the verification emails sent on sign-up.
      - name: Backend services
        working-directory: .backend
        run: |
          docker compose -f docker-compose.dev.yml up -d --wait postgres redis s3 mailpit
          docker compose -f docker-compose.dev.yml run --rm s3-init

      - name: Start backend
        working-directory: .backend
        env:
          # Every browser in the run shares one IP: lift the per-IP auth limits.
          RATE_LIMIT_LOGIN_MAX: "1000"
          RATE_LIMIT_REGISTER_MAX: "1000"
          RATE_LIMIT_REFRESH_MAX: "1000"
        run: |
          cp .env.example .env
          bun install --frozen-lockfile
          bun run migrate
          nohup bun ./src/index.ts > backend.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://localhost:3000/ready; do sleep 1; done'

      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
      - run: bun run e2e
        env:
          CI: "true"

      - if: failure()
        run: cat .backend/backend.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
