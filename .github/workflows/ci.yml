name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The backend owns the wire contracts; check src/contracts against its master.
      - uses: actions/checkout@v4
        with:
          repository: llOrtegall/backend_messages_chat
          path: .backend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run contracts:check
        env:
          CONTRACTS_BACKEND_DIR: .backend
      # Lint has known react-hooks errors that the hexagonal rewrite (tasks T4.x) removes;
      # report them without failing the build until then.
      - run: bun run lint
        continue-on-error: true
      - run: bun run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
