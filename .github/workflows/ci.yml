name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The backend owns the wire contracts; check src/contracts against its master.
      - uses: actions/checkout@v4
        with:
          repository: llOrtegall/backend_messages_chat
          path: .backend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run contracts:check
        env:
          CONTRACTS_BACKEND_DIR: .backend
      - run: bun run lint
      - run: bun run test
      - run: bun run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=https://chat.example.com -t chat-web .
